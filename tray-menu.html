<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>托盘菜单</title>
    <style>
      /*
        自绘托盘菜单

        为什么要自绘、而不是用原生 Menu.popup：
        壁纸模式开着鼠标转发（electron-as-wallpaper 会 RIDEV_INPUTSINK 全系统鼠标事件、
        再合成点击塞进壁纸窗口），原生弹出菜单会被这些合成点击当场关掉。
        这个页面跑在**独立的置顶窗口**里，收的是真实鼠标消息，所以菜单项点得动。
      */
      :root {
        --glass-rgb: 32, 32, 38;
        --text-rgb: 255, 255, 255;
        --glass-alpha: 0.72;
        --accent: 111, 140, 255;
        --danger: 208, 48, 80;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
        font: 13px/1.4 system-ui, 'Microsoft YaHei', sans-serif;
      }
      #menu {
        margin: 0;
        padding: 6px;
        border-radius: 10px;
        color: rgb(var(--text-rgb));
        background: rgba(var(--glass-rgb), calc(var(--glass-alpha) + 0.2));
        border: 1px solid rgba(var(--text-rgb), 0.14);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      }
      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 10px;
        border-radius: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item:hover {
        background: rgba(var(--accent), 0.28);
      }
      .item:active {
        background: rgba(var(--accent), 0.45);
      }
      .item .label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item .hint {
        opacity: 0.55;
        font-size: 12px;
      }
      .item.danger:hover {
        background: rgba(var(--danger), 0.42);
      }
      .sep {
        height: 1px;
        margin: 5px 8px;
        background: rgba(var(--text-rgb), 0.14);
      }
      .now {
        padding: 4px 10px 6px;
        font-size: 12px;
        opacity: 0.6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="menu"></div>
    <script type="module" src="/src/trayMenu/main.ts"></script>
  </body>
</html>
